<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#EFF6FF"/>
        <stop offset="100%" stop-color="#DBEAFE"/>
      </linearGradient>
      <filter id="toyShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#25213A" flood-opacity="0.12"/>
      </filter>
    </defs>
    <!-- Background card -->
    <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
    <!-- Subtle pattern circles -->
    <circle cx="60" cy="60" r="30" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="340" cy="80" r="45" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="330" cy="330" r="25" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="80" cy="320" r="40" fill="#FFFFFF" opacity="0.2"/>
    <!-- Main Toy Artwork -->
    <g filter="url(#toyShadow)" transform="translate(0, 0)">
      
    <rect x="70" y="130" width="260" height="160" rx="20" fill="#1E293B"/>
    <rect x="85" y="180" width="230" height="95" rx="8" fill="#FFFFFF"/>
    <!-- White Keys -->
    <line x1="115" y1="180" x2="115" y2="275" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="145" y1="180" x2="145" y2="275" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="175" y1="180" x2="175" y2="275" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="205" y1="180" x2="205" y2="275" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="235" y1="180" x2="235" y2="275" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="265" y1="180" x2="265" y2="275" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="290" y1="180" x2="290" y2="275" stroke="#CBD5E1" stroke-width="3"/>
    <!-- Black Keys -->
    <rect x="103" y="180" width="18" height="60" rx="4" fill="#0F172A"/>
    <rect x="135" y="180" width="18" height="60" rx="4" fill="#0F172A"/>
    <rect x="195" y="180" width="18" height="60" rx="4" fill="#0F172A"/>
    <rect x="225" y="180" width="18" height="60" rx="4" fill="#0F172A"/>
    <rect x="255" y="180" width="18" height="60" rx="4" fill="#0F172A"/>
  
    </g>
  </svg>