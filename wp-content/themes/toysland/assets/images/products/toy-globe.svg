<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E0F2FE"/>
        <stop offset="100%" stop-color="#BAE6FD"/>
      </linearGradient>
      <filter id="toyShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#25213A" flood-opacity="0.12"/>
      </filter>
    </defs>
    <!-- Background card -->
    <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
    <!-- Subtle pattern circles -->
    <circle cx="60" cy="60" r="30" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="340" cy="80" r="45" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="330" cy="330" r="25" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="80" cy="320" r="40" fill="#FFFFFF" opacity="0.2"/>
    <!-- Main Toy Artwork -->
    <g filter="url(#toyShadow)" transform="translate(0, 0)">
      
    <path d="M120 280 Q70 200 120 120 Q200 50 280 120" stroke="#64748B" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="200" cy="180" r="70" fill="#0284C7"/>
    <path d="M170 140 Q190 130 220 150 Q230 180 210 200 Q190 220 170 190 Z" fill="#22C55E"/>
    <rect x="190" y="270" width="20" height="50" fill="#64748B"/>
    <rect x="150" y="315" width="100" height="20" rx="10" fill="#334155"/>
  
    </g>
  </svg>