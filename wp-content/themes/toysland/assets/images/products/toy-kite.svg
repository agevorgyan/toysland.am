<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FEF3C7"/>
        <stop offset="100%" stop-color="#FDE68A"/>
      </linearGradient>
      <filter id="toyShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#25213A" flood-opacity="0.12"/>
      </filter>
    </defs>
    <!-- Background card -->
    <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
    <!-- Subtle pattern circles -->
    <circle cx="60" cy="60" r="30" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="340" cy="80" r="45" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="330" cy="330" r="25" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="80" cy="320" r="40" fill="#FFFFFF" opacity="0.2"/>
    <!-- Main Toy Artwork -->
    <g filter="url(#toyShadow)" transform="translate(0, 0)">
      
    <polygon points="200,80 270,180 200,280 130,180" fill="#EF4444"/>
    <polygon points="200,80 270,180 200,180" fill="#F97316"/>
    <polygon points="200,180 270,180 200,280" fill="#FBBF24"/>
    <polygon points="130,180 200,180 200,280" fill="#3B82F6"/>
    <polygon points="130,180 200,80 200,180" fill="#10B981"/>
    <!-- Tail -->
    <path d="M200 280 Q180 320 220 340" stroke="#78350F" stroke-width="4" fill="none"/>
    <circle cx="215" cy="335" r="8" fill="#EC4899"/>
  
    </g>
  </svg>