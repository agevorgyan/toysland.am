<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF1F2"/>
        <stop offset="100%" stop-color="#FFE4E6"/>
      </linearGradient>
      <filter id="toyShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#25213A" flood-opacity="0.12"/>
      </filter>
    </defs>
    <!-- Background card -->
    <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
    <!-- Subtle pattern circles -->
    <circle cx="60" cy="60" r="30" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="340" cy="80" r="45" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="330" cy="330" r="25" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="80" cy="320" r="40" fill="#FFFFFF" opacity="0.2"/>
    <!-- Main Toy Artwork -->
    <g filter="url(#toyShadow)" transform="translate(0, 0)">
      
    <rect x="80" y="270" width="240" height="24" rx="12" fill="#D97706"/>
    <rect x="100" y="150" width="200" height="20" rx="10" fill="#D97706"/>
    <rect x="100" y="130" width="24" height="170" rx="12" fill="#E11D48"/>
    <rect x="135" y="145" width="24" height="155" rx="12" fill="#F97316"/>
    <rect x="170" y="160" width="24" height="140" rx="12" fill="#FBBF24"/>
    <rect x="205" y="175" width="24" height="125" rx="12" fill="#10B981"/>
    <rect x="240" y="190" width="24" height="110" rx="12" fill="#0EA5E9"/>
    <rect x="275" y="205" width="24" height="95" rx="12" fill="#8B5CF6"/>
    <!-- Mallet -->
    <line x1="280" y1="80" x2="220" y2="180" stroke="#78350F" stroke-width="8" stroke-linecap="round"/>
    <circle cx="280" cy="80" r="18" fill="#EF4444"/>
  
    </g>
  </svg>