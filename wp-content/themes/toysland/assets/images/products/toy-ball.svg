<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E0E7FF"/>
        <stop offset="100%" stop-color="#C7D2FE"/>
      </linearGradient>
      <filter id="toyShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#25213A" flood-opacity="0.12"/>
      </filter>
    </defs>
    <!-- Background card -->
    <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
    <!-- Subtle pattern circles -->
    <circle cx="60" cy="60" r="30" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="340" cy="80" r="45" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="330" cy="330" r="25" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="80" cy="320" r="40" fill="#FFFFFF" opacity="0.2"/>
    <!-- Main Toy Artwork -->
    <g filter="url(#toyShadow)" transform="translate(0, 0)">
      
    <circle cx="200" cy="200" r="95" fill="#EF4444"/>
    <path d="M105 200 A95 95 0 0 0 295 200 A95 45 0 0 0 105 200" fill="#FBBF24"/>
    <path d="M200 105 A95 95 0 0 0 200 295 A45 95 0 0 0 200 105" fill="#3B82F6"/>
    <circle cx="200" cy="200" r="95" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  
    </g>
  </svg>