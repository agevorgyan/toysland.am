<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDF2F8"/>
        <stop offset="100%" stop-color="#FCE7F3"/>
      </linearGradient>
      <filter id="toyShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#25213A" flood-opacity="0.12"/>
      </filter>
    </defs>
    <!-- Background card -->
    <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
    <!-- Subtle pattern circles -->
    <circle cx="60" cy="60" r="30" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="340" cy="80" r="45" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="330" cy="330" r="25" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="80" cy="320" r="40" fill="#FFFFFF" opacity="0.2"/>
    <!-- Main Toy Artwork -->
    <g filter="url(#toyShadow)" transform="translate(0, 0)">
      
    <rect x="100" y="100" width="95" height="95" rx="8" fill="#EC4899"/>
    <rect x="205" y="100" width="95" height="95" rx="8" fill="#8B5CF6"/>
    <rect x="100" y="205" width="95" height="95" rx="8" fill="#06B6D4"/>
    <rect x="205" y="205" width="95" height="95" rx="8" fill="#F59E0B"/>
    <circle cx="198" cy="148" r="16" fill="#EC4899"/>
    <circle cx="148" cy="198" r="16" fill="#06B6D4"/>
  
    </g>
  </svg>