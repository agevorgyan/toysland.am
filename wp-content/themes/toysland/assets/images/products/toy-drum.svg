<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FEE2E2"/>
        <stop offset="100%" stop-color="#FECACA"/>
      </linearGradient>
      <filter id="toyShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#25213A" flood-opacity="0.12"/>
      </filter>
    </defs>
    <!-- Background card -->
    <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
    <!-- Subtle pattern circles -->
    <circle cx="60" cy="60" r="30" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="340" cy="80" r="45" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="330" cy="330" r="25" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="80" cy="320" r="40" fill="#FFFFFF" opacity="0.2"/>
    <!-- Main Toy Artwork -->
    <g filter="url(#toyShadow)" transform="translate(0, 0)">
      
    <ellipse cx="200" cy="140" rx="90" ry="32" fill="#E2E8F0"/>
    <path d="M110 140 L110 240 Q200 280 290 240 L290 140 Z" fill="#DC2626"/>
    <ellipse cx="200" cy="240" rx="90" ry="32" fill="#B91C1C"/>
    <!-- Drumsticks -->
    <line x1="120" y1="80" x2="190" y2="135" stroke="#78350F" stroke-width="7" stroke-linecap="round"/>
    <circle cx="120" cy="80" r="10" fill="#FDE047"/>
    <line x1="280" y1="80" x2="210" y2="135" stroke="#78350F" stroke-width="7" stroke-linecap="round"/>
    <circle cx="280" cy="80" r="10" fill="#FDE047"/>
  
    </g>
  </svg>