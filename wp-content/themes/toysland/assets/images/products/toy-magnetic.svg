<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F3E8FF"/>
        <stop offset="100%" stop-color="#E9D5FF"/>
      </linearGradient>
      <filter id="toyShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#25213A" flood-opacity="0.12"/>
      </filter>
    </defs>
    <!-- Background card -->
    <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
    <!-- Subtle pattern circles -->
    <circle cx="60" cy="60" r="30" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="340" cy="80" r="45" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="330" cy="330" r="25" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="80" cy="320" r="40" fill="#FFFFFF" opacity="0.2"/>
    <!-- Main Toy Artwork -->
    <g filter="url(#toyShadow)" transform="translate(0, 0)">
      
    <polygon points="200,90 270,210 130,210" fill="#F43F5E" opacity="0.9"/>
    <polygon points="200,105 255,200 145,200" fill="#FFF" opacity="0.3"/>
    <rect x="130" y="225" width="140" height="70" rx="8" fill="#0EA5E9" opacity="0.9"/>
    <rect x="145" y="235" width="110" height="50" rx="6" fill="#FFF" opacity="0.3"/>
    <circle cx="165" cy="260" r="12" fill="#E2E8F0"/>
    <circle cx="235" cy="260" r="12" fill="#E2E8F0"/>
  
    </g>
  </svg>