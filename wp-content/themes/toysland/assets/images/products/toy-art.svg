<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDF4FF"/>
        <stop offset="100%" stop-color="#FAE8FF"/>
      </linearGradient>
      <filter id="toyShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#25213A" flood-opacity="0.12"/>
      </filter>
    </defs>
    <!-- Background card -->
    <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
    <!-- Subtle pattern circles -->
    <circle cx="60" cy="60" r="30" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="340" cy="80" r="45" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="330" cy="330" r="25" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="80" cy="320" r="40" fill="#FFFFFF" opacity="0.2"/>
    <!-- Main Toy Artwork -->
    <g filter="url(#toyShadow)" transform="translate(0, 0)">
      
    <rect x="90" y="110" width="220" height="180" rx="16" fill="#F59E0B"/>
    <rect x="105" y="125" width="190" height="150" rx="10" fill="#FFFFFF"/>
    <!-- Color palette circles -->
    <circle cx="140" cy="165" r="16" fill="#EF4444"/>
    <circle cx="180" cy="165" r="16" fill="#F59E0B"/>
    <circle cx="220" cy="165" r="16" fill="#10B981"/>
    <circle cx="260" cy="165" r="16" fill="#3B82F6"/>
    <!-- Brushes -->
    <line x1="130" y1="240" x2="250" y2="210" stroke="#78350F" stroke-width="8" stroke-linecap="round"/>
    <circle cx="130" cy="240" r="10" fill="#8B5CF6"/>
  
    </g>
  </svg>