<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FEF3C7"/>
        <stop offset="100%" stop-color="#FDE68A"/>
      </linearGradient>
      <filter id="toyShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#25213A" flood-opacity="0.12"/>
      </filter>
    </defs>
    <!-- Background card -->
    <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
    <!-- Subtle pattern circles -->
    <circle cx="60" cy="60" r="30" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="340" cy="80" r="45" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="330" cy="330" r="25" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="80" cy="320" r="40" fill="#FFFFFF" opacity="0.2"/>
    <!-- Main Toy Artwork -->
    <g filter="url(#toyShadow)" transform="translate(0, 0)">
      
    <!-- Guitar Body -->
    <ellipse cx="200" cy="250" rx="65" ry="75" fill="#EA580C"/>
    <ellipse cx="200" cy="250" rx="45" ry="55" fill="#F97316"/>
    <circle cx="200" cy="230" r="22" fill="#451A03"/>
    <rect x="192" y="70" width="16" height="150" fill="#D97706"/>
    <rect x="186" y="50" width="28" height="35" rx="6" fill="#9A3412"/>
    <!-- Tuning Pegs -->
    <circle cx="178" cy="60" r="6" fill="#FDE047"/>
    <circle cx="178" cy="74" r="6" fill="#FDE047"/>
    <circle cx="222" cy="60" r="6" fill="#FDE047"/>
    <circle cx="222" cy="74" r="6" fill="#FDE047"/>
  
    </g>
  </svg>