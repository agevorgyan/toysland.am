<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FEF9C3"/>
        <stop offset="100%" stop-color="#FEF08A"/>
      </linearGradient>
      <filter id="toyShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#25213A" flood-opacity="0.12"/>
      </filter>
    </defs>
    <!-- Background card -->
    <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
    <!-- Subtle pattern circles -->
    <circle cx="60" cy="60" r="30" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="340" cy="80" r="45" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="330" cy="330" r="25" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="80" cy="320" r="40" fill="#FFFFFF" opacity="0.2"/>
    <!-- Main Toy Artwork -->
    <g filter="url(#toyShadow)" transform="translate(0, 0)">
      
    <circle cx="200" cy="200" r="90" fill="#F59E0B"/>
    <circle cx="200" cy="200" r="78" fill="#FFFFFF"/>
    <!-- Hour marks -->
    <circle cx="200" cy="135" r="5" fill="#1E293B"/>
    <circle cx="265" cy="200" r="5" fill="#1E293B"/>
    <circle cx="200" cy="265" r="5" fill="#1E293B"/>
    <circle cx="135" cy="200" r="5" fill="#1E293B"/>
    <!-- Hands -->
    <line x1="200" y1="200" x2="200" y2="150" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
    <line x1="200" y1="200" x2="235" y2="200" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="200" cy="200" r="8" fill="#1E293B"/>
  
    </g>
  </svg>